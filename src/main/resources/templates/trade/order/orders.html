<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head lang="en">

    <title>Order List</title>

    <!--/*/ <th:block th:include="fragments/headerinc :: head"></th:block> /*/-->
</head>
<body>
<div class="container">
    <!--/*/ <th:block th:include="fragments/header :: header"></th:block> /*/-->
    <div th:if="${not #lists.isEmpty(orders)}">
        <h2>Order List</h2>
        <table class="table table-striped">
            <tr>
                <th>Id</th>
                <th>Symbol</th>
                <th>Date</th>
                <th>Settlement Date</th>
                <th>Buy Shares</th>
                <th>Buy Fee</th>
                <th>Buy Price</th>
                <th>Sell Shares</th>
                <th>Sell Fee</th>
                <th>Sell Price</th>
                <th>Sent Email</th>
                <th>View</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}"><a href="/order/${order.id}">Id</a></td>
                <td th:text="${order.symbol}">Symbol</td>
                <td th:text="${#dates.format(order.createdDate, 'yyyy-MM-dd')}">Date</td>
                <td th:text="${order.settlementDate}">Settlement Date</td>
                <td th:text="${order.buyNum}">Buy Num</td>
                <td th:text="${order.buyFee}">Buy Fee</td>
                <td th:text="${order.buyPrice}">Buy Price</td>
                <td th:text="${order.sellNum}">Sell Num</td>
                <td th:text="${order.sellFee}">Sell Fee</td>
                <td th:text="${order.sellPrice}">Sell Price</td>
                <td th:text="${order.sent}">Sent Email</td>
                <td><a th:href="${'/trade/order/' + order.id}">View</a></td>
                <td><a th:href="${'/trade/order/edit/' + order.id}">Edit</a></td>
                <td><a th:href="${'/trade/order/delete/' + order.id}">Delete</a></td>
            </tr>
        </table>

    </div>
</div>

</body>
</html>
