<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head lang="en">

    <title>Order Detail</title>

    <!--/*/ <th:block th:include="/fragments/headerinc :: head"></th:block> /*/-->
</head>
<body>
<div class="container">
    <!--/*/ <th:block th:include="/fragments/header :: header"></th:block> /*/-->

    <h2>Stock Details</h2>
        <div>
            <form class="form-horizontal">
                <div class="form-group">
                    <label class="col-sm-2 control-label">Id:</label>
                    <div class="col-sm-10">
                        <p class="form-control-static" th:text="${order.id}">Id</p></div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">Symbol:</label>
                    <div class="col-sm-10">
                        <p class="form-control-static" th:text="${order.symbol}">Symbol</p></div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">Date:</label>
                    <div class="col-sm-10">
                        <p class="form-control-static" th:text="${order.createdDate}">Date</p>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">Settlement Date:</label>
                    <div class="col-sm-10">
                        <p class="form-control-static" th:text="${order.settlementDate}">Settlement Date</p>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">Buy Num:</label>
                    <div class="col-sm-10">
                        <p class="form-control-static" th:text="${order.buyNum}">Buy Num</p>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">Buy Fee:</label>
                    <div class="col-sm-10">
                        <p class="form-control-static" th:text="${order.buyFee}">Buy Fee</p>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">Buy Price:</label>
                    <div class="col-sm-10">
                        <p class="form-control-static" th:text="${order.buyPrice}">Buy Price</p>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">Sell Num:</label>
                    <div class="col-sm-10">
                        <p class="form-control-static" th:text="${order.sellNum}">Sell Num</p>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">Sell Fee:</label>
                    <div class="col-sm-10">
                        <p class="form-control-static" th:text="${order.sellFee}">Sell Fee</p>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">Sell Price:</label>
                    <div class="col-sm-10">
                        <p class="form-control-static" th:text="${order.sellPrice}">Sell Price</p>
                    </div>
                </div>
            </form>
    </div>
</div>
<!--/*/ <th:block th:include="fragments/footer :: footer"></th:block> /*/-->
</body>
</html>
