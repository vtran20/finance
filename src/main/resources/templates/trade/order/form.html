<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head lang="en">

    <title>Spring Framework Guru</title>

    <!--/*/ <th:block th:include="/fragments/headerinc :: head"></th:block> /*/-->
</head>
<body>
<div class="container">
    <!--/*/ <th:block th:include="/fragments/header :: header"></th:block> /*/-->

    <h2>Order Details</h2>
    <div>
        <form class="form-horizontal" th:object="${order}" th:action="@{/trade/order}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="form-group">
                <label class="col-sm-2 control-label">Symbol:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{symbol}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Name:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{name}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Buy Shares:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{boughtShareNum}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Buy Price:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{boughtShareAmount}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Buy Fee:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{boughtShareFee}"/>
                </div>
            </div>
            <div class="row">
                <button type="submit" class="btn btn-default">Submit</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
