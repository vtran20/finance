<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head lang="en">

    <title>Add/Edit Order</title>

    <!--/*/ <th:block th:include="/fragments/headerinc :: head"></th:block> /*/-->
</head>
<body>
<div class="container">
    <!--/*/ <th:block th:include="/fragments/header :: header"></th:block> /*/-->

    <h2>Order Details</h2>
    <div>
        <form class="form-horizontal" th:object="${order}" th:action="@{/trade/order}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="form-group">
                <label class="col-sm-2 control-label">Symbol:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{symbol}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Buy Shares:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{buyNum}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Buy Price:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{buyPrice}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Buy Fee:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{buyFee}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Sent Email:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{sent}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Sell Shares:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{sellNum}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Sell Price:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{sellPrice}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Sell Fee:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{sellFee}"/>
                </div>
            </div>

            <div class="row">
                <button type="submit" class="btn btn-default">Submit</button>
            </div>
        </form>
    </div>
</div>
<!--/*/ <th:block th:include="fragments/footer :: footer"></th:block> /*/-->
</body>
</html>
