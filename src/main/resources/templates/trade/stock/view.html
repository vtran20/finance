<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head lang="en">

    <title>Spring Framework Guru</title>

    <!--/*/ <th:block th:include="/fragments/headerinc :: head"></th:block> /*/-->
</head>
<body>
<div class="container">
    <!--/*/ <th:block th:include="/fragments/header :: header"></th:block> /*/-->
    <h2>Stock Details</h2>
    <div>
        <form class="form-horizontal">
            <div class="form-group">
                <label class="col-sm-2 control-label">Stock Id:</label>

                <div class="col-sm-10">
                    <p class="form-control-static" th:text="${stock.id}">Stock Id</p></div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Symbol:</label>

                <div class="col-sm-10">
                    <p class="form-control-static" th:text="${stock.symbol}">Symbol</p>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Name:</label>

                <div class="col-sm-10">
                    <p class="form-control-static" th:text="${stock.name}">Name</p>
                </div>
            </div>
        </form>
    </div>
</div>
<!--/*/ <th:block th:include="fragments/footer :: footer"></th:block> /*/-->
</body>
</html>
