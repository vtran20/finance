<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<HEAD>
    <TITLE>Team Divide Random </TITLE>
    <META NAME="Generator" CONTENT="EditPlus">
    <META NAME="Author" CONTENT="">
    <META NAME="Keywords" CONTENT="">
    <META NAME="Description" CONTENT="">
</HEAD>

<style>
    td.header {
        color: #ff0000;
        text-align: center;
    }

    td.data_input input {
        color: #008000;
    }
</style>

<BODY>

<form name="team_divide" action="/team" method="get">
    <TABLE>
        <TR>
            <TD class="header">Name</TD>
            <TD class="header">Join(Y/N)</TD>
            <TD class="header">Attack</TD>
            <TD class="header">Defense</TD>
            <TD class="header">Performance</TD>
            <TD class="header">Total</TD>
        </TR>

        <TR th:each="player,iter : ${allListPlayers}">
            <TD class="data_input"><input type="text" th:name="name+${iter.index}" th:value="${player.name}"/></TD>
            <TD class="data_input"><input type="checkbox" th:name="join+${iter.index}" th:checked="${player.join}"/></TD>
            <TD class="data_input"><input type="text" th:name="attack+${iter.index}" th:value="${player.attack}"/></TD>
            <TD class="data_input"><input type="text" th:name="defense+${iter.index}" th:value="${player.defense}"/></TD>
            <TD class="data_input"><input type="text" th:name="performance+${iter.index}" th:value="${player.performance}"/></TD>
            <TD class="data_input" th:text="${player.total}"></TD>
        </TR>

    </TABLE>
    <br>

    <div>Number of Team (2 or 3 teams): <input type="text" name="team" th:value="${team}"/></div>
    <div>Constraint different point: <input type="text" name="constraint" th:value="${constraint}"/></div>
    <div><input type="submit" name="refresh" value="Refresh"></div>
</form>

<div th:switch="${error}">
    <div th:case="'true'"><div th:text="${error}">Only support 2 or 3 teams at the time.</div></div>
    <div th:case="'false'">
        <div th:switch="${team}">
            <div th:case="'2'">
                <TABLE border=1>
                    <TR>
                        <TD class="header">Team A</TD>
                        <TD class="header">Team B</TD>
                    </TR>
                    <TR>
                        <TD class="data_input" th:text="${teamA.names}"></TD>
                        <TD class="data_input" th:text="${teamB.names}"></TD>
                    </TR>
                    <TR>
                        <TD class="data_input" th:text="${teamA.TotalPoint}"></TD>
                        <TD class="data_input" th:text="${teamB.TotalPoint}"></TD>
                    </TR>
                    <TR>
                        <TD colspan="3" class="data_input" th:text="${'Diff: '+diffPoint}"></TD>
                    </TR>
                </TABLE>
            </div>
            <div th:case="'3'">
                <TABLE border=1>
                    <TR>
                        <TD class="header">Team A</TD>
                        <TD class="header">Team B</TD>
                        <TD class="header">Team C</TD>
                    </TR>
                    <TR>
                        <TD class="data_input" th:text="${teamA.names}"></TD>
                        <TD class="data_input" th:text="${teamB.names}"></TD>
                        <TD class="data_input" th:text="${teamC.names}"></TD>
                    </TR>
                    <TR>
                        <TD class="data_input" th:text="${teamA.TotalPoint}"></TD>
                        <TD class="data_input" th:text="${teamB.TotalPoint}"></TD>
                        <TD class="data_input" th:text="${teamC.TotalPoint}"></TD>
                    </TR>
                    <TR>
                        <TD colspan="3" class="data_input" th:text="${'Diff: '+diffPoint}"></TD>
                    </TR>
                </TABLE>
            </div>
        </div>
    </div>
</div>

</BODY>
</HTML>
