<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head lang="en">

    <title>Stock List</title>

    <!--/*/ <th:block th:include="fragments/headerinc :: head"></th:block> /*/-->
</head>
<body>
<div class="container">
    <!--/*/ <th:block th:include="fragments/header :: header"></th:block> /*/-->
    <div th:if="${not #lists.isEmpty(stockdailyprices)}">
        <h2>Stock List</h2>
        <table class="table table-striped">
            <tr>
                <th>Id</th>
                <th>Symbol</th>
                <th>Date</th>
                <th>Price</th>
            </tr>
            <tr th:each="stock : ${stockdailyprices}">
                <td th:text="${stock.id}">Id</td>
                <td th:text="${stock.symbol}">Symbol</td>
                <td th:text="${stock.date}">Date</td>
                <td th:text="${stock.price}">Price</td>
            </tr>
        </table>

    </div>
</div>

</body>
</html>
